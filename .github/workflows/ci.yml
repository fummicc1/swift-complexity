name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04]
        swift-version: ["6.2"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Setup Swift
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Install dependencies for Swiftly
            sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config python3-lldb-13
            
            # Install Swiftly
            curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
            tar zxf swiftly-$(uname -m).tar.gz
            ./swiftly init --verbose --assume-yes --skip-install
            . ~/.local/share/swiftly/env.sh
            
            # Install Swift
            swiftly install ${{ matrix.swift-version }}
            echo "$(dirname $(which swift))" >> $GITHUB_PATH
          else
            # macOS - use Xcode's Swift
            echo "Using Xcode's Swift on macOS"
            xcode-select --print-path
          fi
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            .build
            Package.resolved
          key: ${{ runner.os }}-swift-${{ matrix.swift-version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift-version }}-

      - name: Build package (macOS)
        if: runner.os == 'macOS'
        run: swift build --configuration release --traits IndexStore

      - name: Build package (Linux)
        if: runner.os == 'Linux'
        run: |
          # Swiftly installs toolchains to ~/.local/share/swiftly/toolchains/<version>/
          # 'which swift' returns the wrapper, so we need to get the actual toolchain path
          SWIFTLY_HOME="${HOME}/.local/share/swiftly"
          TOOLCHAIN_USR=$(ls -d ${SWIFTLY_HOME}/toolchains/*/usr 2>/dev/null | head -1)
          # Check if TOOLCHAIN_USR is found
          test -n "${TOOLCHAIN_USR}" || (echo "Toolchain path not found!" && exit 1)
          echo "Using toolchain: ${TOOLCHAIN_USR}"
          # --- debug ---
          # For debug, check if headers exist
          ls ${TOOLCHAIN_USR}/lib/swift || (echo "Swift lib directory not found!" && exit 1)
          test -d ${TOOLCHAIN_USR}/lib/swift/Block || (echo "Block header not found!" && exit 1)
          # --- end debug ---
          # --static-swift-stdlib matches the release build so static linking
          # breakage is caught on every PR, not at release time
          swift build --configuration release --static-swift-stdlib \
            --traits IndexStore \
            -Xcxx -I${TOOLCHAIN_USR}/lib/swift \
            -Xcxx -I${TOOLCHAIN_USR}/lib/swift/Block

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          SWIFT_COMPLEXITY_EXPECT_INDEXSTORE_TRAIT: "1"
        run: swift test --traits IndexStore

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          SWIFT_COMPLEXITY_EXPECT_INDEXSTORE_TRAIT: "1"
        run: |
          SWIFTLY_HOME="${HOME}/.local/share/swiftly"
          TOOLCHAIN_USR=$(ls -d ${SWIFTLY_HOME}/toolchains/*/usr 2>/dev/null | head -1)
          swift test --traits IndexStore \
            -Xcxx -I${TOOLCHAIN_USR}/lib/swift \
            -Xcxx -I${TOOLCHAIN_USR}/lib/swift/Block

      - name: Test LCOM4 analysis (macOS)
        if: runner.os == 'macOS'
        run: |
          # Build with debug configuration to generate IndexStore
          swift build --traits IndexStore
          # Run LCOM4 analysis using compiled binary directly
          .build/debug/SwiftComplexityCLI Sources --lcom4 \
            --index-store-path .build/debug/index/store \
            --format json --recursive

      - name: Test LCOM4 analysis (Linux)
        if: runner.os == 'Linux'
        run: |
          SWIFTLY_HOME="${HOME}/.local/share/swiftly"
          # Get toolchain path (without /usr suffix)
          TOOLCHAIN=$(ls -d ${SWIFTLY_HOME}/toolchains/* 2>/dev/null | head -1)
          TOOLCHAIN_USR="${TOOLCHAIN}/usr"
          echo "Using toolchain: ${TOOLCHAIN}"
          # Build with debug configuration to generate IndexStore
          swift build --traits IndexStore \
            -Xcxx -I${TOOLCHAIN_USR}/lib/swift \
            -Xcxx -I${TOOLCHAIN_USR}/lib/swift/Block
          # Run LCOM4 analysis using compiled binary directly (avoids rebuild)
          .build/debug/SwiftComplexityCLI Sources --lcom4 \
            --index-store-path .build/debug/index/store \
            --toolchain-path "${TOOLCHAIN}" \
            --format json --recursive

      - name: Test coupling analysis (macOS)
        if: runner.os == 'macOS'
        run: |
          # Reuses the debug build + index store from the LCOM4 step above.
          .build/debug/SwiftComplexityCLI Sources --coupling \
            --index-store-path .build/debug/index/store \
            --format json --recursive > coupling-report.json 2> coupling-diag.txt
          cat coupling-diag.txt
          # Structural invariants rather than pinned values, so refactors
          # don't break CI: the CLI entry point is referenced by nothing
          # (instability exactly 1.0), pure models depend on nothing
          # project-side, and the formatter touches most models.
          jq -e '[.files[].typeCouplings[]?] | length > 20' coupling-report.json
          jq -e '[.files[].typeCouplings[]?] | any(.name == "ComplexityCommand" and .instability == 1)' coupling-report.json
          jq -e '[.files[].typeCouplings[]?] | any(.name == "SuppressedMetric" and .fanOut == 0 and .fanIn >= 5)' coupling-report.json
          jq -e '[.files[].typeCouplings[]?] | any(.name == "OutputFormatter" and .fanOut >= 15)' coupling-report.json
          grep -q "coupling:" coupling-diag.txt
          # Gate round trip: an absurdly low threshold must exit 1...
          printf 'coupling:\n  fanOut: 1\n' > /tmp/coupling-gate.yml
          if .build/debug/SwiftComplexityCLI Sources --coupling \
            --index-store-path .build/debug/index/store \
            --config /tmp/coupling-gate.yml --recursive > /dev/null 2>&1; then
            echo "Expected exit 1 with coupling fanOut threshold 1"; exit 1
          fi
          # ...and an unreachable one must exit 0 (config present, no violation).
          printf 'coupling:\n  fanOut: 9999\n' > /tmp/coupling-gate.yml
          .build/debug/SwiftComplexityCLI Sources --coupling \
            --index-store-path .build/debug/index/store \
            --config /tmp/coupling-gate.yml --recursive > /dev/null

      - name: Test coupling analysis (Linux)
        if: runner.os == 'Linux'
        run: |
          SWIFTLY_HOME="${HOME}/.local/share/swiftly"
          TOOLCHAIN=$(ls -d ${SWIFTLY_HOME}/toolchains/* 2>/dev/null | head -1)
          # Reuses the debug build + index store from the LCOM4 step above.
          .build/debug/SwiftComplexityCLI Sources --coupling \
            --index-store-path .build/debug/index/store \
            --toolchain-path "${TOOLCHAIN}" \
            --format json --recursive > coupling-report.json 2> coupling-diag.txt
          cat coupling-diag.txt
          jq -e '[.files[].typeCouplings[]?] | length > 20' coupling-report.json
          jq -e '[.files[].typeCouplings[]?] | any(.name == "ComplexityCommand" and .instability == 1)' coupling-report.json
          jq -e '[.files[].typeCouplings[]?] | any(.name == "SuppressedMetric" and .fanOut == 0 and .fanIn >= 5)' coupling-report.json
          jq -e '[.files[].typeCouplings[]?] | any(.name == "OutputFormatter" and .fanOut >= 15)' coupling-report.json
          grep -q "coupling:" coupling-diag.txt

  default-traits:
    name: Default traits (SPI parity)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Setup Swift
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config python3-lldb-13
            curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
            tar zxf swiftly-$(uname -m).tar.gz
            ./swiftly init --verbose --assume-yes --skip-install
            . ~/.local/share/swiftly/env.sh
            swiftly install 6.2
            echo "$(dirname $(which swift))" >> $GITHUB_PATH
          fi
          swift --version

      # Mirrors what Swift Package Index runs (no traits, no -Xcxx); adding either here would hide the badge regressions this job exists to catch
      - name: Build with default traits
        run: swift build

      - name: Test with default traits
        run: swift test

      - name: Index-backed flags fail with a rebuild hint
        run: |
          set +e
          OUTPUT=$(.build/debug/SwiftComplexityCLI Sources --lcom4 \
            --index-store-path .build/debug/index/store 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          test "$STATUS" -ne 0
          echo "$OUTPUT" | grep -q -- "--traits IndexStore"

  action-test:
    name: Action Test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    # Bare runners on purpose: this proves the action needs no Swift
    # toolchain, which requires release binaries built with
    # --static-swift-stdlib (v1.2.0+) on Linux.
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run swift-complexity action (local checkout, latest version)
        id: analysis
        uses: ./
        with:
          # Default `version: latest` on purpose: this step runs the action
          # code under review, so the latest-release lookup path is covered
          # by CI before every merge. fail-on-threshold is off because this
          # job verifies the action mechanics, not this repo's complexity.
          fail-on-threshold: "false"

      - name: Run swift-complexity action (released tag)
        id: analysis-tag
        # Consumes the action the way users do - resolved from the v1 tag,
        # not the local checkout. The binary version stays pinned so this
        # step is deterministic regardless of newer releases.
        uses: fummicc1/swift-complexity@v1
        with:
          version: "1.2.0"
          output-file: swift-complexity-tag.sarif
          fail-on-threshold: "false"

      - name: Verify SARIF report structure
        run: |
          for REPORT in "${{ steps.analysis.outputs.report-file }}" "${{ steps.analysis-tag.outputs.report-file }}"; do
            test -s "$REPORT" || { echo "Report is missing or empty: $REPORT"; exit 1; }
            jq -e '.runs[0].tool.driver.name == "swift-complexity"' "$REPORT" > /dev/null
            echo "SARIF report OK: $REPORT ($(jq '.runs[0].results | length' "$REPORT") results)"
          done

  lint:
    name: Code Quality
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Setup Swift
        run: |
          # macOS - use Xcode's Swift
          echo "Using Xcode's Swift on macOS"
          xcode-select --print-path
          swift --version

      - name: Install swift-format (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install swift-format

      - name: Install swift-format (Linux)
        if: runner.os == 'Linux'
        run: |
          # On Linux, we'll skip swift-format for now as it requires complex setup
          echo "swift-format check skipped on Linux"

      - name: Check code formatting
        if: runner.os == 'macOS'
        run: |
          swift-format --configuration .swift-format --recursive Sources Tests

      - name: Lint documentation
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: ".markdownlint.yml"
        continue-on-error: true

  complexity-analysis:
    name: Self Complexity Analysis
    runs-on: macos-15
    needs: [test]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Setup Swift
        run: |
          # macOS - use Xcode's Swift
          echo "Using Xcode's Swift on macOS"
          xcode-select --print-path
          swift --version

      - name: Build swift-complexity
        run: swift build --configuration release

      - name: Run complexity analysis on self
        run: |
          swift run SwiftComplexityCLI Sources --format json --threshold 15 --recursive > complexity-report.json

      - name: Upload complexity report
        uses: actions/upload-artifact@v7
        with:
          name: complexity-report
          path: complexity-report.json

      - name: Comment complexity results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('complexity-report.json', 'utf8'));
              
              let comment = '## 🔍 Complexity Analysis Results\n\n';
              
              if (report.files && report.files.length > 0) {
                comment += `Found ${report.files.length} files with functions exceeding threshold (15):\n\n`;
                
                report.files.forEach(file => {
                  comment += `### ${file.filePath}\n`;
                  comment += '| Function | Cyclomatic | Cognitive |\n';
                  comment += '|----------|------------|----------|\n';
                  
                  file.functions.forEach(func => {
                    const cyclo = func.cyclomaticComplexity >= 15 ? `**${func.cyclomaticComplexity}**` : func.cyclomaticComplexity;
                    const cogn = func.cognitiveComplexity >= 15 ? `**${func.cognitiveComplexity}**` : func.cognitiveComplexity;
                    comment += `| ${func.name} | ${cyclo} | ${cogn} |\n`;
                  });
                  comment += '\n';
                });
              } else {
                comment += '✅ All functions are below the complexity threshold of 15.\n';
              }
              
              comment += '\n*This analysis was performed by swift-complexity itself.*';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('No complexity report found or parsing failed:', error);
            }
