name: SARIF PR Annotation Verification (temporary)

# Temporary, verification-only workflow. Scoped to this branch so it does not
# affect the main CI path (ci.yml, main/develop). Uploads a SARIF report with
# a low threshold to confirm GitHub Code Scanning renders inline PR
# annotations for swift-complexity's new `-f sarif` output. This file is
# removed once verification is complete.

on:
  push:
    branches: [feature/sarif-output-format]

permissions:
  contents: read
  security-events: write

jobs:
  verify-sarif-annotations:
    name: Upload SARIF and verify annotations
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Build package
        run: swift build --configuration release

      - name: Generate SARIF report with a low threshold
        # A low threshold guarantees at least one violation so the annotation
        # rendering can actually be observed on this PR.
        run: |
          .build/release/SwiftComplexityCLI Sources \
            --format sarif --threshold 3 --recursive \
            > swift-complexity-verification.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: swift-complexity-verification.sarif
